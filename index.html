<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>좀비 슈터</title>
  <script>/* PXI icons */
/* PXI: 14x14 도형 DSL로 그리고, 자동 하이라이트/그림자/외곽선을 입혀 16x16 픽셀 아이콘을 만든다 */
(function (G) {
  var N = 14, OUT = "#0c1316";
  function hex(c) { c = c.replace("#", ""); if (c.length === 3) c = c.replace(/./g, "$&$&"); var n = parseInt(c, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function hs(a) { return "#" + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? "0" : "") + v.toString(16); }).join(""); }
  function mix(c, d, t) { var a = hex(c), b = hex(d); return hs([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]); }
  function lt(c, t) { return mix(c, "#ffffff", t === undefined ? .4 : t); }
  function dk(c, t) { return mix(c, "#000814", t === undefined ? .4 : t); }

  function Canvas() {
    var g = [], i; for (i = 0; i < N * N; i++) g.push(null);
    var o = {
      g: g,
      px: function (x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < N && y < N) g[y * N + x] = c; return o; },
      rect: function (x, y, w, h, c) { for (var j = 0; j < h; j++) for (var k = 0; k < w; k++) o.px(x + k, y + j, c); return o; },
      disc: function (cx, cy, r, c) { for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var dx = x - cx, dy = y - cy; if (dx * dx + dy * dy <= r * r + .35) g[y * N + x] = c; } return o; },
      ring: function (cx, cy, r, w, c) { for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy); if (d <= r + .4 && d > r - w + .4) g[y * N + x] = c; } return o; },
      line: function (x0, y0, x1, y1, c) { var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2 || 1; for (var i = 0; i <= n; i++) o.px(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); return o; },
      poly: function (pts, c) {
        for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
          var ins = false, px = x + .5, py = y + .5;
          for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
            if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) ins = !ins;
          }
          if (ins) g[y * N + x] = c;
        }
        return o;
      },
      erase: function (cx, cy, r) { for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var dx = x - cx, dy = y - cy; if (dx * dx + dy * dy <= r * r + .35) g[y * N + x] = null; } return o; }
    };
    return o;
  }

  /* 아이콘 정의: function(c, t)  c = 메인 색(틴트), t = 도화지 */
  var I = {
    coin: function (c, t) { t.disc(7, 7, 6, c).ring(7, 7, 4, 1, dk(c, .25)).rect(6, 4, 2, 6, dk(c, .4)).px(5, 5, lt(c, .6)); },
    fire: function (c, t) {
      t.poly([[7, 0], [9, 3], [11, 6], [12, 9], [10, 12.5], [7, 14], [4, 12.5], [2, 9], [3, 6], [5, 4]], c);
      t.poly([[7, 5], [9, 8], [9, 11], [7, 13], [5, 11], [5, 8]], lt(c, .45)).poly([[7, 8], [8, 10], [7, 12], [6, 10]], "#fff6c8");
    },
    star: function (c, t) {
      var p = [], i; for (i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 2.9 : 7; p.push([7 + Math.cos(a) * r, 7.4 + Math.sin(a) * r]); }
      t.poly(p, c).px(6, 5, lt(c, .7)).px(7, 4, lt(c, .7));
    },
    shield: function (c, t) {
      t.poly([[1, 1], [13, 1], [13, 7], [7, 14], [1, 7]], c).poly([[7, 1], [13, 1], [13, 7], [7, 14]], dk(c, .22));
      t.rect(6, 3, 2, 7, lt(c, .55)).rect(4, 5, 6, 2, lt(c, .55));
    },
    wind: function (c, t) {
      var w = lt(c, .5);
      t.line(1, 4, 8, 4, w).line(8, 4, 10, 3, w).line(10, 3, 11, 5, w).px(10, 5, w);
      t.line(0, 7, 11, 7, c).line(11, 7, 13, 8, c).line(13, 8, 12, 10, c).line(12, 10, 10, 10, c);
      t.line(2, 10, 7, 10, w).line(7, 10, 8, 12, w).line(8, 12, 6, 12, w);
    },
    wave: function (c, t) {
      var w = lt(c, .55), d = dk(c, .2), r, x, y;
      for (r = 0; r < 3; r++) for (x = 0; x < 14; x++) {
        y = 2 + r * 4 + (Math.floor(x / 2) % 2 ? 1 : 0);
        t.px(x, y, r === 0 ? w : c).px(x, y + 1, r === 0 ? c : d);
      }
    },
    gun: function (c, t) {
      t.rect(1, 3, 12, 4, c).rect(2, 3, 9, 1, lt(c, .5)).rect(2, 7, 4, 6, dk(c, .1)).rect(7, 7, 2, 2, dk(c, .3)).rect(11, 2, 2, 1, dk(c, .3)).px(9, 8, lt(c, .4));
    },
    skull: function (c, t) {
      t.disc(7, 6, 5.5, c).rect(4, 9, 6, 4, c).rect(3, 5, 3, 3, "#14202a").rect(8, 5, 3, 3, "#14202a").px(7, 8, "#14202a").rect(5, 11, 1, 2, "#14202a").rect(8, 11, 1, 2, "#14202a").px(4, 3, lt(c, .6));
    },
    monster: function (c, t) {
      t.poly([[1, 0], [5, 3], [3, 6]], "#f1ece0").poly([[13, 0], [9, 3], [11, 6]], "#f1ece0");
      t.disc(7, 8, 5.5, c).rect(3, 6, 3, 2, "#ffe066").rect(8, 6, 3, 2, "#ffe066").px(4, 7, "#1b1b1b").px(9, 7, "#1b1b1b");
      t.rect(4, 10, 6, 2, "#14202a").px(5, 10, "#f1ece0").px(8, 10, "#f1ece0");
    },
    beast: function (c, t) {
      t.disc(7, 9, 3.4, c).disc(2.5, 6, 1.7, c).disc(5.5, 2.8, 1.8, c).disc(9.5, 2.8, 1.8, c).disc(12, 6, 1.7, c).px(6, 8, lt(c, .5));
    },
    ghost: function (c, t) {
      t.disc(7, 6, 5.5, c).rect(1, 6, 13, 7, c).px(1, 13, null).px(4, 13, null).px(9, 13, null).px(12, 13, null).rect(4, 5, 2, 3, "#14202a").rect(8, 5, 2, 3, "#14202a").px(4, 3, lt(c, .7));
    },
    trophy: function (c, t) {
      t.poly([[3, 1], [11, 1], [10, 7], [8, 9], [6, 9], [4, 7]], c).ring(2.5, 4, 2.4, 1, c).ring(11.5, 4, 2.4, 1, c);
      t.rect(6, 9, 2, 2, dk(c, .2)).rect(4, 11, 6, 2, dk(c, .1)).px(5, 3, lt(c, .7)).px(5, 4, lt(c, .7));
    },
    leaf: function (c, t) {
      t.disc(4, 4, 3, c).disc(10, 4, 3, c).disc(4, 9, 3, c).disc(10, 9, 3, c).disc(7, 6.5, 2, dk(c, .2));
      t.line(7, 8, 8, 13, dk(c, .45)).px(3, 3, lt(c, .6)).px(9, 3, lt(c, .6));
    },
    book: function (c, t) {
      t.rect(2, 1, 10, 12, c).rect(2, 1, 2, 12, dk(c, .35)).rect(5, 3, 6, 1, "#f1ece0").rect(5, 5, 6, 1, "#f1ece0").rect(5, 7, 4, 1, "#f1ece0").rect(4, 11, 8, 2, "#f1ece0");
    },
    target: function (c, t) {
      t.disc(7, 7, 6, c).disc(7, 7, 4, "#f1ece0").disc(7, 7, 2.2, c).px(7, 7, "#f1ece0");
    },
    magnify: function (c, t) {
      t.disc(5.5, 5.5, 4.4, "#cfe9f3").ring(5.5, 5.5, 5, 1.6, c).line(9, 9, 13, 13, dk(c, .3)).line(10, 9, 13, 12, dk(c, .3)).px(4, 3, "#fff");
    },
    gift: function (c, t) {
      t.rect(1, 6, 12, 8, c).rect(0, 4, 14, 3, lt(c, .2)).rect(6, 4, 2, 10, "#ffd166").disc(4.5, 2.4, 2, "#ffd166").disc(9.5, 2.4, 2, "#ffd166").erase(4.5, 2.4, .9).erase(9.5, 2.4, .9).rect(6, 3, 2, 2, "#ffd166");
    },
    heart: function (c, t) {
      t.disc(4, 4.5, 3.4, c).disc(10, 4.5, 3.4, c).poly([[0.6, 6], [13.4, 6], [7, 13.5]], c).px(3, 3, lt(c, .75)).px(4, 2, lt(c, .75));
    },
    drop: function (c, t) {
      t.poly([[7, 0], [11, 7], [11, 10], [7, 14], [3, 10], [3, 7]], c).px(5, 8, lt(c, .7)).px(5, 9, lt(c, .7));
    },
    boot: function (c, t) {
      t.rect(3, 1, 5, 8, c).poly([[3, 8], [8, 8], [13, 10], [13, 13], [3, 13]], c).rect(3, 12, 11, 2, dk(c, .45)).rect(3, 1, 5, 2, lt(c, .35)).px(10, 10, lt(c, .5));
    },
    calendar: function (c, t) {
      t.rect(1, 2, 12, 11, "#f1ece0").rect(1, 2, 12, 4, c).rect(3, 0, 2, 3, "#8896a0").rect(9, 0, 2, 3, "#8896a0");
      for (var y = 0; y < 2; y++) for (var x = 0; x < 3; x++) t.rect(3 + x * 3, 8 + y * 3, 2, 2, dk(c, .1));
    },
    gear: function (c, t) {
      var i; for (i = 0; i < 8; i++) { var a = i * Math.PI / 4; t.rect(Math.round(6 + Math.cos(a) * 5.4), Math.round(6 + Math.sin(a) * 5.4), 2, 2, c); }
      t.disc(7, 7, 4.6, c).disc(7, 7, 2, "#14202a").px(4, 4, lt(c, .6));
    },
    gamepad: function (c, t) {
      t.rect(1, 3, 12, 8, c).rect(0, 5, 14, 5, c).rect(2, 11, 3, 2, c).rect(9, 11, 3, 2, c);
      t.rect(3, 6, 1, 3, "#14202a").rect(2, 7, 3, 1, "#14202a").px(9, 6, "#ef476f").px(11, 8, "#ffd166").px(9, 9, "#06d6a0").px(7, 5, lt(c, .5));
    },
    lock: function (c, t) {
      t.ring(7, 4.5, 3.6, 1.8, "#cfd8dc").rect(2, 6, 10, 8, c).rect(6, 8, 2, 3, "#14202a").rect(2, 6, 10, 1, lt(c, .5));
    },
    bolt: function (c, t) {
      t.poly([[8, 0], [2, 8], [6, 8], [4, 14], [12, 5], [8, 5], [10, 0]], c).px(6, 3, lt(c, .7)).px(5, 5, lt(c, .7));
    },
    magnet: function (c, t) {
      t.ring(7, 7, 6, 4, c).rect(0, 7, 14, 7, null).rect(0, 7, 4, 7, c).rect(10, 7, 4, 7, c).rect(0, 11, 4, 3, "#e5ecef").rect(10, 11, 4, 3, "#e5ecef").px(3, 3, lt(c, .6));
    },
    question: function (c, t) {
      t.disc(7, 7, 6, dk(c, .1)).rect(5, 3, 4, 1, "#fff").rect(9, 4, 1, 2, "#fff").rect(7, 6, 2, 1, "#fff").rect(6, 7, 1, 2, "#fff").rect(6, 10, 2, 2, "#fff").rect(4, 4, 1, 2, "#fff");
    },
    refresh: function (c, t) {
      t.ring(7, 7, 5.6, 2, c).rect(7, 0, 7, 5, null).poly([[7, 0], [13, 3], [7, 6]], c).px(2, 7, lt(c, .5));
    },
    web: function (c, t) {
      var i; for (i = 0; i < 4; i++) { var a = i * Math.PI / 4; t.line(7 - Math.cos(a) * 6.5, 7 - Math.sin(a) * 6.5, 7 + Math.cos(a) * 6.5, 7 + Math.sin(a) * 6.5, c); }
      t.ring(7, 7, 3, 1, c).ring(7, 7, 5.8, 1, dk(c, .1));
    },
    crown: function (c, t) {
      t.poly([[1, 4], [4, 7], [7, 1], [10, 7], [13, 4], [12, 12], [2, 12]], c).rect(2, 11, 10, 2, dk(c, .25)).px(7, 8, "#ef476f").px(4, 10, "#4cc9f0").px(10, 10, "#4cc9f0").px(6, 3, lt(c, .7));
    },
    snow: function (c, t) {
      var i; for (i = 0; i < 3; i++) { var a = i * Math.PI / 3 + Math.PI / 6; t.line(7 - Math.cos(a) * 6.4, 7 - Math.sin(a) * 6.4, 7 + Math.cos(a) * 6.4, 7 + Math.sin(a) * 6.4, c); }
      t.rect(6, 6, 2, 2, lt(c, .7)).px(7, 1, lt(c, .7)).px(7, 12, lt(c, .7));
    },
    clock: function (c, t) {
      t.disc(7, 7, 6, "#f1ece0").ring(7, 7, 6, 1.5, c).line(7, 7, 7, 3, "#14202a").line(7, 7, 10, 8, "#14202a").px(7, 7, "#ef476f");
    },
    brain: function (c, t) {
      t.disc(4.5, 6, 4, c).disc(9.5, 6, 4, c).disc(7, 9, 3.6, c).line(7, 2, 7, 10, dk(c, .35)).px(4, 5, dk(c, .3)).px(10, 6, dk(c, .3)).px(5, 9, dk(c, .3)).px(3, 3, lt(c, .6));
    },
    trident: function (c, t) {
      t.line(7, 3, 7, 13, c).line(2, 2, 2, 6, c).line(12, 2, 12, 6, c).line(2, 6, 12, 6, c).px(7, 0, c).px(7, 1, c).px(7, 2, c).px(2, 1, lt(c, .5)).px(12, 1, lt(c, .5)).rect(6, 11, 3, 1, dk(c, .3));
    },
    dice: function (c, t) {
      t.rect(1, 1, 12, 12, "#f1ece0").rect(1, 1, 12, 12, "#f1ece0").px(3, 3, c).px(10, 3, c).px(7, 7, c).px(3, 10, c).px(10, 10, c).rect(3, 3, 2, 2, c).rect(9, 3, 2, 2, c).rect(6, 6, 2, 2, c).rect(3, 9, 2, 2, c).rect(9, 9, 2, 2, c);
    },
    bow: function (c, t) {
      t.ring(5, 7, 6, 1.6, c).rect(5, 0, 9, 14, null).line(2, 7, 13, 7, "#e5ecef").poly([[13, 7], [10, 5], [10, 9]], "#e5ecef").px(1, 6, lt(c, .5));
    },
    ufo: function (c, t) {
      t.disc(7, 5, 3.6, "#9be7ff").rect(0, 5, 14, 1, null).poly([[0, 8], [3, 5.5], [11, 5.5], [14, 8], [11, 10.5], [3, 10.5]], c).px(3, 8, "#ffd166").px(7, 8, "#ffd166").px(11, 8, "#ffd166").rect(4, 11, 2, 2, lt(c, .3)).rect(8, 11, 2, 2, lt(c, .3));
    },
    bomb: function (c, t) {
      t.disc(6.5, 8, 5, c).line(9, 3, 11, 1, "#c9a66b").px(12, 1, "#ffd166").px(11, 0, "#ff9f1c").px(13, 2, "#ff9f1c").px(4, 6, lt(c, .6)).px(4, 7, lt(c, .6));
    },
    chart: function (c, t) {
      t.rect(1, 9, 3, 4, dk(c, .1)).rect(5, 6, 3, 7, c).rect(9, 3, 3, 10, lt(c, .2)).line(1, 6, 5, 3, "#ffd166").line(5, 3, 7, 4, "#ffd166").px(8, 1, "#ffd166").px(9, 1, "#ffd166");
    },
    chest: function (c, t) {
      t.rect(1, 5, 12, 8, c).poly([[1, 5], [3, 1], [11, 1], [13, 5]], lt(c, .15)).rect(1, 7, 12, 1, dk(c, .45)).rect(6, 6, 2, 4, "#ffd166").px(7, 8, "#14202a");
    },
    disk: function (c, t) {
      t.rect(1, 1, 12, 12, c).rect(3, 1, 8, 5, "#cfd8dc").rect(4, 8, 6, 5, "#f1ece0").rect(8, 2, 2, 3, "#14202a").rect(5, 9, 4, 1, "#9aa7ad").rect(5, 11, 4, 1, "#9aa7ad");
    },
    sword: function (c, t) {
      t.line(11, 2, 3, 10, "#e5ecef").line(12, 2, 4, 10, "#cfd8dc").line(12, 1, 12, 3, "#fff").line(2, 8, 6, 12, "#c9a66b").line(1, 11, 3, 13, "#8a5a2b").px(12, 1, "#fff").line(2, 9, 5, 12, c);
    },
    fist: function (c, t) {
      t.rect(2, 4, 10, 8, c).rect(1, 6, 2, 5, c).rect(11, 3, 2, 4, c).rect(4, 4, 1, 3, dk(c, .3)).rect(7, 4, 1, 3, dk(c, .3)).rect(2, 11, 10, 2, dk(c, .3)).px(3, 5, lt(c, .5));
    },
    sound: function (c, t) {
      t.rect(1, 5, 3, 4, c).poly([[4, 5], [8, 1], [8, 13], [4, 9]], c).px(2, 6, lt(c, .6));
      t.rect(10, 5, 1, 4, lt(c, .5)).rect(12, 3, 1, 8, lt(c, .3));
    },
    check: function (c, t) { t.line(1, 7, 5, 11, c).line(5, 11, 13, 2, c).line(1, 8, 5, 12, c).line(5, 12, 13, 3, c); },
    cross: function (c, t) { t.line(2, 2, 12, 12, c).line(12, 2, 2, 12, c).line(3, 2, 12, 11, c).line(11, 2, 2, 11, c); },
    arrow: function (c, t) { t.rect(1, 5, 8, 4, c).poly([[8, 1], [13, 7], [8, 13]], c); },
    arrowup: function (c, t) { t.rect(5, 5, 4, 8, c).poly([[1, 6], [7, 0], [13, 6]], c); },
    arrowleft: function (c, t) { t.rect(5, 5, 8, 4, c).poly([[6, 1], [1, 7], [6, 13]], c); },
    arrowdown: function (c, t) { t.rect(5, 1, 4, 8, c).poly([[1, 8], [7, 14], [13, 8]], c); },
    minus: function (c, t) { t.rect(1, 5, 12, 4, c); },
    swap: function (c, t) { t.rect(3, 3, 8, 2, c).poly([[0, 4], [4, 0], [4, 8]], c).rect(3, 9, 8, 2, c).poly([[14, 10], [10, 6], [10, 14]], c); },
    person: function (c, t) {
      t.disc(7, 3.5, 3, "#f3d3b0").poly([[2, 14], [3, 8], [11, 8], [12, 14]], c).rect(4, 8, 6, 1, lt(c, .4)).px(6, 3, "#14202a").px(8, 3, "#14202a");
    },
    house: function (c, t) {
      t.poly([[0, 7], [7, 0], [14, 7]], dk(c, .1)).rect(2, 7, 10, 7, "#f1ece0").rect(6, 9, 3, 5, c).rect(3, 8, 2, 2, "#4cc9f0").px(6, 2, lt(c, .5));
    },
    gem: function (c, t) {
      t.poly([[3, 1], [11, 1], [14, 5], [7, 14], [0, 5]], c).poly([[3, 1], [7, 1], [7, 14], [0, 5]], lt(c, .25)).line(0, 5, 14, 5, lt(c, .55)).px(3, 3, "#fff").px(4, 2, "#fff");
    },
    eye: function (c, t) {
      t.poly([[0, 7], [4, 3], [10, 3], [14, 7], [10, 11], [4, 11]], "#f1ece0").disc(7, 7, 3.2, c).disc(7, 7, 1.5, "#14202a").px(6, 6, "#fff");
    },
    rain: function (c, t) {
      t.disc(4, 5, 3, "#9aa7ad").disc(8, 4, 3.4, "#b7c2c8").disc(11, 6, 2.6, "#9aa7ad").rect(2, 5, 11, 3, "#9aa7ad").line(3, 10, 2, 13, c).line(7, 10, 6, 13, c).line(11, 10, 10, 13, c);
    },
    sun: function (c, t) {
      var i; for (i = 0; i < 8; i++) { var a = i * Math.PI / 4; t.line(7 + Math.cos(a) * 4.6, 7 + Math.sin(a) * 4.6, 7 + Math.cos(a) * 6.8, 7 + Math.sin(a) * 6.8, c); }
      t.disc(7, 7, 3.6, c).px(6, 6, lt(c, .7));
    },
    moon: function (c, t) { t.disc(7, 7, 6, c).erase(10, 5, 5).px(4, 5, lt(c, .6)); },
    radiation: function (c, t) {
      t.disc(7, 7, 6.2, c).poly([[7, 7], [7, 1.3], [12, 4]], "#14202a").poly([[7, 7], [12, 10], [7, 12.8]], "#14202a").poly([[7, 7], [2, 4], [2, 10]], "#14202a").disc(7, 7, 1.6, c).ring(7, 7, 6.2, 1, "#14202a");
    },
    potion: function (c, t) {
      t.rect(5, 0, 4, 4, "#cfd8dc").poly([[5, 4], [9, 4], [13, 12], [12, 14], [2, 14], [1, 12]], "#b7e4f2").poly([[3, 9], [11, 9], [13, 12], [12, 14], [2, 14], [1, 12]], c).px(5, 6, "#fff").px(5, 7, "#fff");

		function setCard(c, n) {
			var cur = L(c.id);
			n = Math.max(0, Math.min(prMx(c), n));
			if (n == cur) return;
			if (n > cur) {
				if (exBlock(c)) {
					toast("⚠ 같이 쓸 수 없는 카드가 있어요");
					return;
				}
				for (var l = cur + 1; l <= n; l++) {
					P.c[c.id] = l;
					if (c.f) c.f();
				}
				P.c[c.id] = n;
				return;
			}
			var cs = {};
			for (var k in P.c) if (P.c[k] > 0) cs[k] = P.c[k];
			if (n > 0) cs[c.id] = n;
			else delete cs[c.id];
			rebuild(cs);
		}

	function renderChar(box, row) {
		if (!CHARS.some(function(c) {
			return c.id == META.sel && META.ch.indexOf(c.id) >= 0;
		}) || META.ch.indexOf("adv") < 0) {
			META.sel = "adv";
			if (META.ch.indexOf("adv") < 0) META.ch.push("adv");
			saveMeta();
		}
		var hd = document.createElement("div");
		hd.style.cssText = "font-size:17px";
		hd.innerHTML = "🪙 <b style=\"color:var(--accent);font-weight:400\">" + META.coins + "</b> · 선택한 캐릭터는 다음 판부터 적용돼요";
		box.appendChild(hd);
		CHARS.filter(charVis).forEach(function(c) {
			var own = META.ch.indexOf(c.id) >= 0, sel = META.sel == c.id, lk = (c.lock || c.need && !wopen(c.need)) && !own, sk = (UQ[c.id] || []).map(function(s) {
				return s.i + " " + s.n;
			}).join(" · "), r = row(c.i, c.n, sel ? "✔ 선택됨" : own ? "보유" : lk ? (c.need ? "🔒 강화" : "🔒 업적") : "🪙 " + c.cost, c.d + (c.cards ? "<br><small>🃏 시작 카드: " + cardTxt(c) + "</small>" : "") + (sk ? "<br><small>⭐ 고유 스킬: " + sk + "</small>" : "") + (lk ? "<br><small>🔒 해금 조건: 영구 강화 최종 능력 「" + wlbl(c.need) + "」 개방 · 해금 비용 🪙 " + c.cost + "</small>" : ""), sel), b = document.createElement("button");
			b.style.cssText = "margin-left:auto;font-size:15px;padding:8px 12px";
			if (sel) {
				b.textContent = "사용 중";
				b.disabled = true;
				b.style.opacity = .5;
			} else if (own) {
				b.textContent = "선택";
				b.addEventListener("click", function() {
					META.sel = c.id;
					saveMeta();
					reList("char");
				});
			} else if (lk) {
				b.textContent = "🔒 잠김";
				b.disabled = true;
				b.style.opacity = .45;
			} else {
				b.textContent = "🪙 " + c.cost + " 해금";
				b.style.opacity = META.coins >= c.cost ? 1 : .45;
				b.addEventListener("click", function() {
					if (META.coins < c.cost) {
						toast("코인이 부족해요");
						return;
					}
					META.coins -= c.cost;
					META.ch.push(c.id);
					META.sel = c.id;
					saveMeta();
					QUI();
					reList("char");
				});
			}
			r.appendChild(b);

				} : nd, ri == 6 ? "필요: 5번째 칸 + ◆ " + wlbl("b" + si) + " 또는 " + wlbl("b" + (si + 5) % 6) : ri == 1 ? "시작점에서 바로 열 수 있어요" : "");

			pg.push({

				b: gP("6칸 합계 " + gC(tot) + "<br><small>이웃 가지: " + GBN[(si + 5) % 6] + " · " + GBN[(si + 1) % 6] + "</small>") + rows
			});
		})(si);
		["a", "b"].forEach(function(k) {
			var rows = "", lv = k == "a" ? 2 : 4;
			for (g = 0; g < 6; g++) rows += gNode(gW(k + g), "필요: " + GBN[g] + " " + lv + "번째 + " + GBN[(g + 1) % 6] + " " + lv + "번째 칸");
			pg.push({
				h: "◆ 연결 노드 " + (k == "a" ? "(입구)" : "(중반)"),
				b: gP("이웃한 두 가지의 <b>" + lv + "번째 칸</b>을 둘 다 열면 열 수 있어요. 가격 " + gC(gW(k + "0").cost) + ".") + rows
			});
		});
		var sum = 0;
		for (m = 1; m <= 8; m++) sum += gW("x0a0m" + m).cost;
		var ar = "";
		for (si = 0; si < 6; si++) ar += tutRow(GBN[si].split(" ")[0], "<b>" + GBN[si].split(" ")[1] + "</b><br><small>" + ARMS[si].map(function(a) {
			var e = a[3] ? fdesc(a[3]) + " (3·6번째 칸은 " + fdesc(a[2]) + ")" : fdesc(a[2]);
			return wseen("x" + si + "a" + ARMS[si].indexOf(a) + "m1") ? a[1] + " " + a[0] + ": " + e + " /칸" : "❓ ???";
		}).join("<br>") + "</small>");
		pg.push({
			h: "✦ 외곽 확장 (1)",
			b: gP("각 가지의 ★ 최종 강화를 열면 바깥으로 <b>4줄 × 8칸</b>(가지당 32칸)이 이어져요. 한 줄 가격은 " + gC(gW("x0a0m1").cost) + "에서 " + gC(gW("x0a0m8").cost) + "까지, 한 줄 합계 약 " + gC(sum) + ".") + ar
		});
		var fr = "";
		for (si = 0; si < 6; si++) fr += gNode(gW("f" + si), "필요: " + wlbl("x" + si + "a1m8") + " + " + wlbl("x" + si + "a2m8") + " 줄의 끝(8번째) 칸 둘 다");
		pg.push({
			h: "★ 새 최종 강화 6개",
			b: gP("외곽 확장의 두 줄을 끝까지 열면 도전할 수 있는 <b>궁극의 강화</b>예요. 한 칸 " + gC(gW("f0").cost) + ".") + fr
		});
		var yr = "";
		for (si = 0; si < 6; si++) {
			var nm = [];
			for (m = 1; m <= 4; m++) {
				var y = gW("y" + si + "m" + m);
				nm.push(wseen("y" + si + "m" + m) ? y.i + " " + y.n.replace(/ [IVX]+ ✦/, "") + ": " + y.d : "❓ ???");
			}
			yr += tutRow(GBN[si].split(" ")[0], "<b>" + GBN[si].split(" ")[1] + "</b> <small>" + gC(gW("y" + si + "m1").cost) + " → " + gC(gW("y" + si + "m8").cost) + "</small><br><small>" + nm.join("<br>") + "</small>");
		}
		pg.push({
			h: "✦ 외곽 확장 (2)",
			b: gP("새 최종 강화(★) 바깥으로 이어지는 <b>가장 먼 칸</b>들이에요. 가지당 8칸, 아주 비싸고 효과는 아주 작아요. 네 가지 효과가 순서대로 반복돼요.") + yr
		});
		return pg;
	}
	function gEtc() {
		var pg = [], cs = "";

			var l = POOL.filter(function(c) {
				return c.cat == k[0];

			h: "🃏 카드 분류",

		});
		var ev = "";

			ev += tutRow(r[0], "<b>" + r[1] + "</b> = " + A.i + A.n + " + " + B.i + B.n + "<br><small>" + r[4] + "</small>");
		});
		pg.push({
			h: "🧬 진화 카드",
			b: gP("특정 두 카드를 <b>둘 다 MAX 레벨</b>까지 키우면 강력한 <b>진화 카드</b>가 등장해요. 한 번만 고를 수 있어요.") + ev
		});
		pg.push({
			h: "📦 상자 아이템",
			b: gP("좀비가 5% 확률로(보스는 100%) 떨어뜨리는 📦 상자를 먹으면 아래 중 하나가 랜덤으로 나와요. 한 번 쓰면 사라져요.") + BOXI.map(function(c) {
				return tutRow(c.i, "<b>" + c.n + "</b><br><small>" + c.d + "</small>");
			}).join("")
		});
		pg.push({
			h: "🎮 게임 모드",
			b: gP("모드는 로비 ⚙ 설정에서 바꿀 수 있어요. 모드마다 최고 점수가 따로 저장돼요.") + MODES.map(function(m) {
				return tutRow(m[1].split(" ")[0], "<b>" + m[1].substr(m[1].indexOf(" ") + 1) + "</b><br><small>" + m[2] + "</small>");
			}).join("")
		});
		var ac = "";
		ACH_CATS.forEach(function(k) {
			var l = ACH.filter(function(a) {
				return a[1] == k[0];
			}), t = 0;
			l.forEach(function(a) {
				t += a[6];
			});
			ac += tutRow(k[1], "<b>" + k[2] + "</b> " + l.length + "개 · 시리즈 " + ACH_CH.filter(function(c) {
				return c[1] == k[0];
			}).length + "개 · 보상 합계 " + gC(t) + "<br><small>" + ACH_CH.filter(function(c) {
				return c[1] == k[0];
			}).slice(0, 3).map(function(c) {
				return c[3];
			}).join(" · ") + " …</small>");
		});
		pg.push({
			h: "🏆 업적",
			b: gP("총 <b>" + ACH.length + "개</b>. 비슷한 업적은 시리즈로 묶여 있어요. 작은 단계를 <b>받으면</b> 다음 단계가 나타나요. 달성하면 로비 🏆 업적에서 <b>받기</b>를 눌러 코인을 받아요 (받을 게 있으면 빨간 점이 떠요). 목록 맨 아래에는 조건이 비밀인 <b>🕵️ 숨겨진 업적</b>이 있어요. 아주 어려워요!") + ac
		});
		var dq = "";
		DQ_POOL.forEach(function(t) {
			dq += tutRow(t[1], t[2].replace("{g}", "<b>" + t[5].join("/") + "</b>").replace("{c}", "선택 분류") + "<br><small>🪙 " + t[6].join("/") + "</small>");
		});
		pg.push({
			h: "📅 일일 미션",
			b: gP("매일 새 미션 <b>3개</b>(쉬움·보통·어려움)가 나와요. 전부 완료하면 보너스 " + gC(DQ_BONUS) + "! 매일 접속하면 연속 출석으로 보상이 하루 +" + Math.round(STREAK_STEP * 100) + "%씩, 최대 +" + Math.round(STREAK_MAX * 100) + "%까지 늘어나요.") + "<h4>미션 종류 <small>(쉬움/보통/어려움 목표 · 보상)</small></h4>" + dq

	window.addEventListener("keydown", function(e) {

		}
	}, true);
	var GCH = null;
	function guideClose() {
		$t("tutm").classList.add("hide");
	}
	function guideBuild() {
		GCH = [
			{
				t: "🧑 캐릭터",
				pages: gChars()
			},
			{
				t: "🛠 영구 강화",
				pages: gUp()
			},
			{
				t: "📋 카드·모드·업적·기타",
				pages: gEtc()
			}
		];
	}
	function guideHub() {
		guideBuild();
		var btns = [["🎮 직접 해보기 (약 1분)", function() {
			guideClose();
			TUTstart();
		}]];
		GCH.forEach(function(c, ci) {
			btns.push([c.t + " (" + c.pages.length + "쪽)", function() {
				guidePage(ci, 0);
			}]);
		});
		btns.push([
			"닫기",
			guideClose,
			1
		]);
		tutModal("📘 튜토리얼", gP("보고 싶은 항목을 골라 보세요. 로비의 📘 튜토리얼에서 언제든 다시 열 수 있어요."), btns, -1, "col");
	}
	function guidePage(ci, pi) {
		var c = GCH[ci], pg = c.pages[pi], btns = [[
			"📚 목차",
			guideHub,
			1
		]];
		if (pi > 0) btns.push([
			"◀ 이전",
			function() {
				guidePage(ci, pi - 1);
			},
			1
		]);
		btns.push(pi < c.pages.length - 1 ? ["다음 ▶", function() {
			guidePage(ci, pi + 1);
		}] : ["목차로", guideHub]);
		tutModal(pg.h, "<small>" + c.t + " · " + (pi + 1) + "/" + c.pages.length + "</small>" + pg.b, btns, -1);
	}
	try {
		if (localStorage.getItem("zs_tut") === null) TUTask();
	} catch (e) {}
})();</script>

:root{--bg:#1b2a2e;--ink:#f1ece0;--accent:#ffd166;--hot:#ef476f;--box:#0f1a1d;--ol:#070d10;--edge:#34484d;--cyan:#4cc9f0;
--px:3px;--fs-xs:11px;--fs-s:13px;--fs-m:15px;--fs-l:19px;--fs-xl:26px;--fs-t:46px;--ik:1}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Galmuri11","Galmuri","Malgun Gothic","Noto Sans KR",monospace;font-size:var(--fs-m);overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:none;font-smooth:never}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
b,h1,h2,h3,h4{font-weight:700}

/* ---- 픽셀 아이콘 (이모지 자리에 들어간다) ---- */
.pxi{display:inline-block;overflow:hidden;width:calc(var(--ik) * 16px);height:calc(var(--ik) * 16px);font-size:0;line-height:0;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;vertical-align:calc(var(--ik) * -3px);flex:none}
.card .ic,.row .ic{--ik:2}
.card .ic .pxi{--ik:3}
#hbox .pxi,#pbtn .pxi{--ik:1.5}
#dbtn .pxi{--ik:3}
#tutm .tr .ic .pxi{--ik:1}
h1 .pxi,h2 .pxi{--ik:2}

/* ---- 공통 픽셀 패널: 노치 모서리 + 안쪽 하이라이트/그림자 ---- */
.card,.row,.chip,#tutb,#tutm .tb,#toast,#prbadge,#hpbar,button,#info,#xpbar,#mycards .chip{
  border:0;border-radius:0;background:var(--f,var(--box));
  box-shadow:
    0 calc(var(--px)*-1) 0 0 var(--bc,var(--edge)),0 var(--px) 0 0 var(--bc,var(--edge)),
    calc(var(--px)*-1) 0 0 0 var(--bc,var(--edge)),var(--px) 0 0 0 var(--bc,var(--edge)),
    inset var(--px) var(--px) 0 0 color-mix(in srgb,var(--f,var(--box)) 80%,#fff),
    inset calc(var(--px)*-1) calc(var(--px)*-1) 0 0 color-mix(in srgb,var(--f,var(--box)) 55%,#000)}

/* ---- 버튼 ---- */
button{--f:var(--accent);--bc:var(--ol);font:inherit;font-weight:700;font-size:var(--fs-l);padding:calc(var(--px)*4) calc(var(--px)*10);color:#2a1d05;cursor:pointer;margin:var(--px);text-shadow:0 var(--px) 0 rgba(255,255,255,.28)}
button:active:not(:disabled){transform:translateY(var(--px))}
button:focus-visible{outline:var(--px) dashed var(--ink);outline-offset:calc(var(--px)*2)}
button.sub{--f:#172a2f;--bc:#4a666c;color:var(--ink);font-size:var(--fs-m);padding:calc(var(--px)*3) calc(var(--px)*7);text-shadow:none}
button:disabled{opacity:.45;cursor:default}

/* ---- HUD ---- */
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:calc(var(--px)*4) calc(var(--px)*5);pointer-events:none;font-size:var(--fs-m)}
#hbox{display:flex;align-items:center;gap:calc(var(--px)*2)}
#hpbar{--f:#0b1316;--bc:var(--ol);position:relative;height:calc(var(--px)*7);width:32vw;max-width:220px;overflow:hidden;margin:var(--px)}
#hp{height:100%;width:100%;background:linear-gradient(rgba(255,255,255,.4) 0 var(--px),transparent var(--px) calc(100% - var(--px)*2),rgba(0,0,0,.3) calc(100% - var(--px)*2)),repeating-linear-gradient(90deg,var(--hot) 0 calc(var(--px)*3),#c42a52 calc(var(--px)*3) calc(var(--px)*4));transition:width .15s steps(6)}
#hpbar::after,#xpbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--px)*8 - var(--px)),rgba(7,13,16,.6) calc(var(--px)*8 - var(--px)) calc(var(--px)*8))}
#hpt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:700;text-shadow:var(--px) 0 0 var(--ol),calc(var(--px)*-1) 0 0 var(--ol),0 var(--px) 0 var(--ol),0 calc(var(--px)*-1) 0 var(--ol)}
#info{--f:rgba(15,26,29,.92);--bc:var(--ol);text-align:center;line-height:1.3;font-size:var(--fs-s);flex:0 1 auto;min-width:0;padding:calc(var(--px)*2) calc(var(--px)*4);margin:var(--px) calc(var(--px)*2);white-space:nowrap}
#info b{color:var(--accent);font-size:var(--fs-s)}
#info small{display:block;opacity:.95;font-size:var(--fs-xs);margin-top:var(--px)}
#info small .pxi{--ik:1;margin:0 1px}
#pbtn{pointer-events:auto;--f:#172a2f;--bc:#4a666c;font-size:var(--fs-m);padding:calc(var(--px)*2) calc(var(--px)*3);color:var(--ink);text-shadow:none}
#dbtn{position:fixed;left:calc(var(--px)*5);bottom:calc(env(safe-area-inset-bottom,0px) + var(--px)*12);width:calc(var(--px)*24);height:calc(var(--px)*24);padding:0;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);border:var(--px) solid var(--ol);box-shadow:inset var(--px) var(--px) 0 0 rgba(255,255,255,.18),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 0 rgba(0,0,0,.35);margin:0;background:rgba(144,224,239,.4)}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(239,71,111,.75);opacity:0;transition:opacity .3s}
#cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:30vmin;font-weight:700;color:var(--accent);pointer-events:none;text-shadow:0 calc(var(--px)*3) 0 #b8741a,var(--px) var(--px) 0 var(--ol),calc(var(--px)*-1) var(--px) 0 var(--ol),var(--px) calc(var(--px)*-1) 0 var(--ol),calc(var(--px)*-1) calc(var(--px)*-1) 0 var(--ol),0 calc(var(--px)*4) 0 var(--ol)}
#xpbar{--f:#0b1316;--bc:var(--ol);position:fixed;left:var(--px);right:var(--px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--px)*2);height:calc(var(--px)*4);overflow:hidden}
#xp{height:100%;width:0;background:linear-gradient(rgba(255,255,255,.45) 0 var(--px),transparent var(--px)),repeating-linear-gradient(90deg,var(--cyan) 0 calc(var(--px)*3),#2f9cc6 calc(var(--px)*3) calc(var(--px)*4));transition:width .15s steps(6)}

/* ---- 오버레이(로비 / 일시정지 / 결과) ---- */
#ov,#lv,#list,#tutm{background:repeating-conic-gradient(rgba(255,255,255,.028) 0 25%,transparent 0 50%) 0 0/calc(var(--px)*2) calc(var(--px)*2),rgba(10,18,20,.93)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:calc(var(--px)*4);text-align:center;padding:calc(var(--px)*8);overflow-y:auto;box-sizing:border-box}
#ov h1{margin:0 0 calc(var(--px)*2);font-size:var(--fs-t);color:var(--accent);line-height:1.1;letter-spacing:calc(var(--px)*.5);
  text-shadow:0 calc(var(--px)*1) 0 #d9902a,0 calc(var(--px)*2) 0 #8a4a12,var(--px) 0 0 var(--ol),calc(var(--px)*-1) 0 0 var(--ol),0 calc(var(--px)*-1) 0 var(--ol),var(--px) var(--px) 0 var(--ol),calc(var(--px)*-1) var(--px) 0 var(--ol),var(--px) calc(var(--px)*3) 0 var(--ol),calc(var(--px)*-1) calc(var(--px)*3) 0 var(--ol),0 calc(var(--px)*3) 0 var(--ol)}
#ov p{margin:0;font-size:var(--fs-m);line-height:1.7;opacity:.95;max-width:min(92vw,460px)}
